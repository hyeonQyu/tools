<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="현규의 Tools" />
    <meta name="theme-color" content="#eef0f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101116" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Tools</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        background-color: #eef0f5;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      @media (prefers-color-scheme: dark) {
        #splash {
          background-color: #101116;
        }
        #splash .splash-spinner {
          border-color: #3f3f46;
          border-top-color: #fafafa;
        }
      }
      #splash img {
        width: 80px;
        height: 80px;
        border-radius: 20px;
      }
      #splash .splash-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #e4e4e7;
        border-top-color: #18181b;
        border-radius: 50%;
        animation: splash-spin 0.7s linear infinite;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/icon-192x192.png" alt="Tools" />
      <div class="splash-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
